<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mNeonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F62477"/>
      <stop offset="100%" stop-color="#5DF8D8"/>
    </linearGradient>
    <filter id="mBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full Bleed Background for Adaptive Launcher Masking -->
  <rect width="512" height="512" fill="#1D1D1B"/>

  <!-- Centered Scaled Safe-Zone Emblem (350x350 centered at 81, 81 inside 512x512) -->
  <g transform="translate(81, 81) scale(1.75)">
    <!-- Dark Tactical Octagonal Base -->
    <polygon points="40,10 160,10 190,40 190,160 160,190 40,190 10,160 10,40" fill="#141413" stroke="#262624" stroke-width="2"/>

    <!-- Neon Mint Outer Tactical Frame -->
    <polygon points="44,16 156,16 184,44 184,156 156,184 44,184 16,156 16,44" fill="none" stroke="#5DF8D8" stroke-width="1.5" stroke-dasharray="12 6" opacity="0.8"/>

    <!-- Corner Tech Reticles -->
    <polyline points="20,50 20,20 50,20" fill="none" stroke="#5DF8D8" stroke-width="3"/>
    <polyline points="180,50 180,20 150,20" fill="none" stroke="#5DF8D8" stroke-width="3"/>
    <polyline points="20,150 20,180 50,180" fill="none" stroke="#5DF8D8" stroke-width="3"/>
    <polyline points="180,150 180,180 150,180" fill="none" stroke="#5DF8D8" stroke-width="3"/>

    <!-- Central Chamfered Shield -->
    <polygon points="60,35 140,35 165,60 165,140 140,165 60,165 35,140 35,60" fill="#1D1D1B" stroke="#F62477" stroke-width="2" filter="url(#mBloom)"/>

    <!-- Cyber Glitch Crossbars -->
    <line x1="25" y1="100" x2="175" y2="100" stroke="#5DF8D8" stroke-width="0.5" stroke-dasharray="4 8" opacity="0.4"/>
    <line x1="100" y1="25" x2="100" y2="175" stroke="#5DF8D8" stroke-width="0.5" stroke-dasharray="4 8" opacity="0.4"/>

    <!-- Core "2077" Typographic Glyph -->
    <g fill="#F5F5F5" filter="url(#mBloom)">
      <!-- '2' -->
      <path d="M52,70 L72,70 L72,82 L58,95 L72,95 L72,102 L50,102 L50,92 L64,78 L52,78 Z" fill="#F62477"/>
      <!-- '0' -->
      <path d="M78,70 L96,70 L96,102 L78,102 Z M84,77 L84,95 L90,95 L90,77 Z" fill="#5DF8D8"/>
      <!-- '7' -->
      <path d="M102,70 L122,70 L112,102 L105,102 L114,77 L102,77 Z" fill="#F62477"/>
      <!-- '7' -->
      <path d="M126,70 L146,70 L136,102 L129,102 L138,77 L126,77 Z" fill="#5DF8D8"/>
    </g>

    <!-- Micro HUD Subtext -->
    <text x="100" y="125" fill="#F5F5F5" font-family="'JetBrains Mono', system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="3" text-anchor="middle">2077</text>
    <text x="100" y="142" fill="#5DF8D8" font-family="'JetBrains Mono', system-ui, sans-serif" font-size="7.5" font-weight="700" letter-spacing="2" text-anchor="middle">FAMILY</text>

    <!-- Glowing Pips -->
    <circle cx="100" cy="50" r="3" fill="#F62477" filter="url(#mBloom)"/>
    <circle cx="100" cy="152" r="2" fill="#5DF8D8"/>
  </g>
</svg>
